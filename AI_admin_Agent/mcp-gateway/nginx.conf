worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 256;
}

http {
  access_log off;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 32m;

  upstream mcp_arxiv { server 127.0.0.1:8791; }
  upstream mcp_memory { server 127.0.0.1:8792; }
  upstream mcp_cron { server 127.0.0.1:8793; }
  upstream mcp_fetch { server 127.0.0.1:8794; }
  upstream mcp_sequential_thinking { server 127.0.0.1:8795; }

  server {
    listen 8790;

    location = /health {
      default_type text/plain;
      return 200 'ok';
    }

    location = / {
      default_type application/json;
      return 200 '{"service":"admin_mcp_gateway","endpoints":"/mcp/{id}"}';
    }

    location /mcp/arxiv {
      rewrite ^/mcp/arxiv(.*)$ /mcp$1 break;
      proxy_pass http://mcp_arxiv;
      include /etc/nginx/proxy-mcp.conf;
    }
    location /mcp/memory {
      rewrite ^/mcp/memory(.*)$ /mcp$1 break;
      proxy_pass http://mcp_memory;
      include /etc/nginx/proxy-mcp.conf;
    }
    location /mcp/cron {
      rewrite ^/mcp/cron(.*)$ /mcp$1 break;
      proxy_pass http://mcp_cron;
      include /etc/nginx/proxy-mcp.conf;
    }
    location /mcp/fetch {
      rewrite ^/mcp/fetch(.*)$ /mcp$1 break;
      proxy_pass http://mcp_fetch;
      include /etc/nginx/proxy-mcp.conf;
    }
    location /mcp/sequential-thinking {
      rewrite ^/mcp/sequential-thinking(.*)$ /mcp$1 break;
      proxy_pass http://mcp_sequential_thinking;
      include /etc/nginx/proxy-mcp.conf;
    }
  }
}
