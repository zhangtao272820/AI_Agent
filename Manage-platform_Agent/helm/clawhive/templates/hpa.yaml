{{- range $name, $agent := .Values.agents }}
{{- if and $agent.enabled (dig "autoscaling" "enabled" false $agent) }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  namespace: {{ include "clawhive.namespace" $ }}
  labels:
    {{- include "clawhive.labels" $ | nindent 4 }}
    app: {{ $name }}
    clawhive.io/agent: {{ $name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ dig "autoscaling" "minReplicas" 1 $agent }}
  maxReplicas: {{ dig "autoscaling" "maxReplicas" 3 $agent }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ dig "autoscaling" "targetCPUUtilizationPercentage" 70 $agent }}
{{- end }}
{{- end }}
