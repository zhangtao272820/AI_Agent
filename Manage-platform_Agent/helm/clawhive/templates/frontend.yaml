apiVersion: apps/v1
kind: Deployment
metadata:
  name: clawhive-frontend
  namespace: {{ include "clawhive.namespace" . }}
  labels:
    {{- include "clawhive.labels" . | nindent 4 }}
    app: clawhive-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: clawhive-frontend
  template:
    metadata:
      labels:
        app: clawhive-frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image }}:{{ include "clawhive.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: clawhive-frontend
  namespace: {{ include "clawhive.namespace" . }}
  labels:
    {{- include "clawhive.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app: clawhive-frontend
  ports:
    - port: {{ .Values.frontend.servicePort }}
      targetPort: 80
      nodePort: {{ .Values.frontend.nodePort }}
