apiVersion: v1
kind: Secret
metadata:
  name: clawhive-secrets
  namespace: {{ include "clawhive.namespace" . }}
  labels:
    {{- include "clawhive.labels" . | nindent 4 }}
type: Opaque
stringData:
  CLAWHIVE_INTERNAL_TOKEN: {{ .Values.secrets.clawhiveInternalToken | quote }}
  ADMIN_USERNAME: {{ .Values.secrets.adminUsername | quote }}
  ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  CLAWHIVE_PG_USER: {{ .Values.secrets.pgUser | quote }}
  CLAWHIVE_PG_PASSWORD: {{ .Values.secrets.pgPassword | quote }}
  CLAWHIVE_PG_DB: {{ .Values.secrets.pgDatabase | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  QWEN_API_KEY: {{ .Values.secrets.qwenApiKey | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clawhive-config
  namespace: {{ include "clawhive.namespace" . }}
  labels:
    {{- include "clawhive.labels" . | nindent 4 }}
data:
  DEPLOY_MODE: "docker"
  AGENT_CONTROL_MODE: {{ .Values.backend.controlMode | quote }}
  K8S_NAMESPACE: {{ include "clawhive.namespace" . | quote }}
  CLAWHIVE_IMAGE_TAG: {{ include "clawhive.imageTag" . | quote }}
  DB_AGENT_HOST: "db_agent"
  RAG_AGENT_HOST: "rag_agent"
  CODE_AGENT_HOST: "code_assistent_agent"
  EXTRACTOR_AGENT_HOST: "extractor_agent"
  AI_ADMIN_AGENT_HOST: "ai_admin_agent"
  MANAGER_AGENT_HOST: "manager_agent"
  DB_PORT: "13101"
  RAG_PORT: "13102"
  CODE_PORT: "13103"
  CRAWLER_PORT: "13104"
  AI_ADMIN_PORT: "13105"
  MANAGER_PORT: "13106"
  CLAWHIVE_BACKEND_URL: "http://clawhive-backend:8000"
  PROMETHEUS_BASE_URL: "http://prometheus:9090"
  TEMPO_BASE_URL: "http://tempo:3200"
  LOKI_BASE_URL: "http://loki:3100"
  GRAFANA_PUBLIC_URL: {{ printf "http://127.0.0.1:%v" .Values.monitoring.grafana.nodePort | quote }}
  LANGFUSE_BASE_URL: "http://langfuse:3000"
  LANGFUSE_PUBLIC_URL: {{ printf "http://127.0.0.1:%v" (dig "monitoring" "langfuse" "nodePort" 13001 .Values) | quote }}
  LANGFUSE_PUBLIC_KEY: "pk-lf-clawhive"
  LANGFUSE_SECRET_KEY: "sk-lf-clawhive"
  MANAGER_OTLP_PUSH: "1"
  MANAGER_OTLP_ENDPOINT: "http://tempo:4318/v1/traces"
  MANAGER_LANGFUSE_OTLP_ENDPOINT: "http://langfuse:3000/api/public/otel/v1/traces"
  LITELLM_ENABLED: {{ if .Values.litellm.enabled }}"1"{{ else }}"0"{{ end }}
  LITELLM_BASE_URL: "http://litellm:4000/v1"
  LITELLM_MASTER_KEY: {{ .Values.litellm.masterKey | default "sk-clawhive-litellm" | quote }}
  {{- if .Values.litellm.enabled }}
  QWEN_BASE_URL: "http://litellm:4000/v1"
  OPENAI_BASE_URL: "http://litellm:4000/v1"
  {{- end }}
