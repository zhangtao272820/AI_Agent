{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clawhive-redis
  namespace: {{ include "clawhive.namespace" . }}
  labels:
    {{- include "clawhive.labels" . | nindent 4 }}
    app: clawhive-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clawhive-redis
  template:
    metadata:
      labels:
        app: clawhive-redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: clawhive-redis
  namespace: {{ include "clawhive.namespace" . }}
  labels:
    {{- include "clawhive.labels" . | nindent 4 }}
spec:
  selector:
    app: clawhive-redis
  ports:
    - port: 6379
      targetPort: 6379
{{- end }}
