apiVersion: apps/v1
kind: Deployment
metadata:
  name: clawhive-backend
  namespace: {{ include "clawhive.namespace" . }}
  labels:
    {{- include "clawhive.labels" . | nindent 4 }}
    app: clawhive-backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: clawhive-backend
  template:
    metadata:
      labels:
        app: clawhive-backend
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image }}:{{ include "clawhive.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: clawhive-config
            - secretRef:
                name: clawhive-secrets
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg2://{{ .Values.secrets.pgUser }}:{{ .Values.secrets.pgPassword }}@clawhive-postgres:5432/{{ .Values.secrets.pgDatabase }}"
            - name: REDIS_URL
              value: "redis://clawhive-redis:6379/0"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: clawhive-backend
  namespace: {{ include "clawhive.namespace" . }}
  labels:
    {{- include "clawhive.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app: clawhive-backend
  ports:
    - port: {{ .Values.backend.servicePort }}
      targetPort: 8000
      nodePort: {{ .Values.backend.nodePort }}
