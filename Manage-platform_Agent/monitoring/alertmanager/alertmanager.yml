# Alertmanager：标准版默认随监控栈启动
# - 平台 webhook：Bearer = CLAWHIVE_INTERNAL_TOKEN（entrypoint 写入 credentials_file）
# - 可选外发：若设置 CLAWHIVE_ALERT_WEBHOOK_URL，entrypoint 追加第二个 receiver（企微/钉钉/自定义兼容 URL）

global:
  resolve_timeout: 5m

route:
  receiver: clawhive-default
  group_by: ["alertname", "severity"]
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 4h

receivers:
  - name: clawhive-default
    webhook_configs:
      - url: "http://clawhive_backend:8000/api/monitor/alertmanager/webhook"
        send_resolved: false
        http_config:
          authorization:
            type: Bearer
            credentials_file: /tmp/clawhive_am_token
