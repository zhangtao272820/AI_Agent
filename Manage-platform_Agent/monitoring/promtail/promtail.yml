# Promtail: scrape Docker container logs → Loki (P1b-2)
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
      - replacement: /var/lib/docker/containers/${__meta_docker_container_id}/${__meta_docker_container_id}-json.log
        target_label: __path__
    pipeline_stages:
      - docker: {}
      # Skip months of historical docker json on first scrape; keep recent window.
      - drop:
          older_than: 6h
          drop_counter_reason: older_than_6h
      - json:
          expressions:
            level: level
            msg: msg
            run_id: run_id
            trace_id: trace_id
            agent: agent
      - labels:
          level:
          agent:
