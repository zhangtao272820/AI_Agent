# Optional Dex IdP for LAN OIDC smoke (compose profile: oidc)
issuer: http://127.0.0.1:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

telemetry:
  http: 0.0.0.0:5558

staticClients:
  - id: clawhive
    redirectURIs:
      - http://127.0.0.1:18000/api/auth/oidc/callback
      - http://localhost:18000/api/auth/oidc/callback
    name: ClawHive
    secret: clawhive-oidc-secret

enablePasswordDB: true

