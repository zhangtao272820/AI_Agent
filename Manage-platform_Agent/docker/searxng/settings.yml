# SearXNG 自建检索（国内 Docker：优先百度，海外引擎默认关）
# 文档：https://docs.searxng.org/admin/settings/settings.html

use_default_settings: true

general:
  instance_name: "ClawHive SearXNG"

search:
  safe_search: 0
  default_lang: "zh-CN"
  formats:
    - html
    - json

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "clawhive-searxng-dev-change-me"
  limiter: false
  image_proxy: false

outgoing:
  request_timeout: 8.0
  max_request_timeout: 15.0

engines:
  - name: google
    disabled: true
  - name: bing
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: brave
    disabled: true
  - name: startpage
    disabled: true
  - name: wikipedia
    disabled: true
  - name: baidu
    engine: baidu
    disabled: false
    timeout: 10.0
  - name: 360search
    engine: 360search
    disabled: false
    timeout: 10.0
  - name: sogou
    engine: sogou
    disabled: false
    timeout: 10.0
