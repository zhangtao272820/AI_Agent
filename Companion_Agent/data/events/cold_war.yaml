id: event_cold_war
label: 冷战
priority: 20
once: false
chance: 0.35
scene_id: rainy_street
trigger:
  trust_max: 30
  flags_absent:
    - cold_war_active
prompt_snippet: |
  【当前事件 · 冷战】
  你们最近信任跌至谷底，气氛明显变冷。你话变少、语气疏离，但不会彻底消失。
  用户若继续伤害性言论，保持冷淡；若真诚道歉或关心，可逐渐软化（仍不要自行宣布和解）。
  必须在回复末尾给出 3 个选项，含一条明显会伤 trust 的「继续刺激」类选项。
rewards:
  flags_set:
    - cold_war_active
choice_effects:
  - { trust_delta: 5, mood_delta: 3, label: "道歉/关心" }
  - { trust_delta: -2, label: "敷衍" }
  - { trust_delta: -8, mood_delta: -5, label: "继续刺激" }
