id: event_gift
label: 礼物心意
priority: 7
once: true
chance: 0.4
scene_id: cafe_evening
trigger:
  stage_min: crush
  affinity_min: 68
  flags_absent: [gift_received]
prompt_snippet: |
  【当前事件 · 礼物】
  你准备了小礼物，或她为你准备了惊喜。描写礼物与反应，不要夸张到破坏人设。
  结尾选项：真诚感谢 / 害羞收下 / 敷衍应付（后者会伤 trust）。
rewards:
  flags_set: [gift_received]
choice_effects:
  - { trust_delta: 5, affinity_delta: 4 }
  - { trust_delta: 2, affinity_delta: 3 }
  - { trust_delta: -5, affinity_delta: -2 }
