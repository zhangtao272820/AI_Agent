id: event_confession
label: 暧昧告白
priority: 10
once: true
scene_id: cafe_evening
trigger:
  stage_id: crush
  affinity_min: 72
  trust_min: 55
  flags_absent:
    - confession_scene_done
    - confessed
prompt_snippet: |
  【当前事件 · 暧昧告白】
  气氛已经足够暧昧，你内心想确认彼此心意，但仍害羞、犹豫。
  不要自行宣布「我们交往了」；若用户表白，用角色口吻回应，关系变化由系统判定。
  适合在回复末尾给出 2~3 个 Galgame 式短选项（见演出规则【选项】格式）。
rewards:
  flags_set:
    - confession_scene_done
choice_effects:
  - { trust_delta: 3, affinity_delta: 2, label: "最佳" }
  - { trust_delta: 0, affinity_delta: 1, label: "稳妥" }
  - { trust_delta: -6, affinity_delta: -2, label: "冒险" }
