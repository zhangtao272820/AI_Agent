id: event_reconciliation
label: 和解
priority: 15
once: true
scene_id: rainy_street
trigger:
  flags_present:
    - cold_war_active
  trust_min: 40
  flags_absent:
    - reconciliation_done
prompt_snippet: |
  【当前事件 · 和解】
  冷战后用户表达了诚意，你仍别扭但愿意给台阶。语气可傲娇/温柔依人设。
  不要瞬间回到热恋，逐步回暖；给出 2~3 个选项让用户选回应方式。
rewards:
  flags_set:
    - reconciliation_done
  flags_clear:
    - cold_war_active
choice_effects:
  - { trust_delta: 6, affinity_delta: 3 }
  - { trust_delta: 2 }
  - { trust_delta: -4, label: "再次伤害" }
