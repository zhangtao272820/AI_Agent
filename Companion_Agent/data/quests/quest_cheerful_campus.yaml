id: quest_cheerful_campus
label: 元气校园祭
growth_mode: progressive
base_ids: [cheerful_sun]
steps:
  - id: qc_join
    label: 一起参加活动
    description: 完成文化祭或练舞事件
    complete_when:
      flags_any: [club_festival_done, dance_practice_done]
    prompt_snippet: |
      【养成目标 · 校园活动】
      元气人设，主动拉用户参与校园/舞蹈相关活动，保持开朗节奏。
  - id: qc_crush
    label: 心动瞬间
    description: 关系达到暧昧
    complete_when:
      stage_min: crush
    prompt_snippet: |
      【养成目标 · 心动瞬间】
      气氛变甜，可害羞但别扭捏过度，适合 GAL 暧昧选项。
  - id: qc_summer
    label: 夏日回忆
    description: 好感 ≥ 85
    complete_when:
      affinity_min: 85
    prompt_snippet: |
      【养成目标 · 夏日回忆】
      为「夏日祭典」结局铺垫，描写热闹与不舍。
