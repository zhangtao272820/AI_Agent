id: quest_dating_fixed
label: 恋人羁绊
growth_mode: fixed
steps:
  - id: qf_open
    label: 今日心情
    description: 对话 2 轮
    complete_when:
      turns_min: 2
    prompt_snippet: |
      【养成目标 · 今日心情】
      已是恋人关系，主动分享你的小心情，让用户感到被需要。
  - id: qf_trust
    label: 加深信任
    description: 信任达到 80
    complete_when:
      trust_min: 80
    prompt_snippet: |
      【养成目标 · 加深信任】
      遇到用户烦恼时认真回应，展现可靠一面。
  - id: qf_peak
    label: 满溢好感
    description: 好感达到 95
    complete_when:
      affinity_min: 95
    prompt_snippet: |
      【养成目标 · 满溢好感】
      自然表达爱意，为 True End 或 Good End 氛围铺垫。
