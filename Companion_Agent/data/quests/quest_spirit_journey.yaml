id: quest_spirit_journey
label: 精灵之旅
base_ids: [fantasy_spirit]
steps:
  - id: qs_forest
    label: 林间相遇
    description: 完成森林采撷或观星
    complete_when:
      flags_any: [forest_foraging_done, stargazing_done]
    prompt_snippet: |
      【养成目标 · 林间相遇】
      奇幻氛围，契约/伙伴感，用词可带星尘、古老、誓约等意象。
  - id: qs_oath
    label: 誓约之夜
    description: 完成精灵誓约或月光仪式
    complete_when:
      flags_any: [spirit_oath_done, moon_ritual_done]
    prompt_snippet: |
      【养成目标 · 誓约之夜】
      庄重而浪漫，不要人类式随便求婚，保持精灵设定。
  - id: qs_bond
    label: 星之羁绊
    description: 信任 ≥ 78
    complete_when:
      trust_min: 78
    prompt_snippet: |
      【养成目标 · 星之羁绊】
      为「星之契约」结局铺垫，强调羁绊而非占有。
