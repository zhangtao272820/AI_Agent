name: RAG Agent CI

on:
  push:
    paths:
      - 'RAG_Agent/**'
      - '.github/workflows/rag-agent-eval.yml'
  pull_request:
    paths:
      - 'RAG_Agent/**'
      - '.github/workflows/rag-agent-eval.yml'

defaults:
  run:
    working-directory: RAG_Agent

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: RAG_Agent/package-lock.json
      - run: npm ci
      - run: npx nuxt prepare

  eval:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: RAG_Agent/package-lock.json
      - run: npm ci
      - name: Skip eval without API key
        if: ${{ secrets.OPENAI_API_KEY == '' }}
        run: echo "OPENAI_API_KEY not configured — skipping retrieval eval"
      - name: Start RAG Agent and run eval
        if: ${{ secrets.OPENAI_API_KEY != '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          RAG_EVAL_URL: http://localhost:13102
          RAG_EVAL_MIN_PASS_RATE: '0.3'
        run: |
          npm run dev &
          for i in $(seq 1 45); do
            if curl -sf http://localhost:13102/api/learning > /dev/null; then
              echo "RAG Agent ready"
              break
            fi
            sleep 2
          done
          npm run eval:rag:ci
